services:
  app:
    image: akadski/app:0.0.4
    container_name: app

    ports:
      - "5000:5000"

    env_file:
      - .env

    volumes:
      - ./log/flask-postgres:/app/log/flask-postgres

    command: >
      gunicorn app:app 
      --config gunicorn.conf.py 
      --bind 0.0.0.0:5000
    
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx

    ports:
      - "80:80"

    volumes:
      - ./config/nginx.tcp.conf:/etc/nginx/conf.d/default.conf:ro
      - ./log/flask-postgres:/var/log/nginx

    depends_on:
      - app

    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: bd

    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_USER: appuser
      POSTGRES_DB: myapp

    volumes:
      - ./pgdata:/var/lib/postgresql/data

    restart: unless-stopped
